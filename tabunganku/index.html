<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tabunganku</title>
<meta name="description" content="Catat tabungan, pantau grafik pemasukan & pengeluaran, dan rawat Streak Pet-mu. ©marnzproyek">
<meta name="theme-color" content="#050b18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div id="app" aria-live="polite"></div>

<!-- Pojok kiri bawah: tanggal, bulan, tahun & jam real-time (semua halaman) -->
<div class="clock" aria-label="Tanggal dan jam saat ini"><span id="clockD"></span><b id="clockT"></b></div>
<div class="credit">©marnzproyek</div>

<nav class="nav" id="nav" aria-label="Navigasi utama"><div class="nav-in"></div></nav>

<!-- ========================================== -->
<!-- KOTAK LOGIN & DAFTAR (disalin dari index.html Marnz Store) -->
<!-- ========================================== -->
<div id="authScreen" class="login-bg">

  <!-- ANIMASI METEOR -->
  <div class="meteor" style="left: 10%; animation-duration: 2s;"></div>
  <div class="meteor" style="left: 50%; animation-duration: 2.5s;"></div>
  <div class="meteor" style="left: 90%; animation-duration: 2.2s;"></div>

  <!-- Pemuat awal (saat mengecek sesi login) -->
  <div id="authBoot"><span class="al-ring"></span><span class="al-orb"></span><span class="al-box"></span></div>

  <div id="authCard" class="auth-card glass-panel hidden-el">

    <!-- PEMUAT TRANSISI MASUK <-> DAFTAR -->
    <div id="authLoader" class="auth-loader"><span class="al-ring"></span><span class="al-orb"></span><span class="al-box"></span></div>

    <!-- TEKS MS EMAS BERKILAU & BERKEDIP -->
    <div class="a-brand">
      <div class="a-logo logo-blink">
        <div class="m">M</div>
        <div class="s">S</div>
      </div>
      <h2 class="a-name logo-blink-slow">Marnz Store</h2>
    </div>

    <!-- JUDUL FORM (berubah otomatis: Welcome Back / Create Account) -->
    <div id="authHeading" class="auth-fade">
      <h3 id="authTitle">Welcome <span class="y">Back</span></h3>
      <p id="authSubtitle">Enter your credentials to access your secure account</p>
    </div>

    <!-- FORM MASUK -->
    <div id="formLogin" class="auth-fade">
      <div class="space-y-4">
        <div class="a-field">
          <i class="fas fa-user lead"></i>
          <input type="email" id="inputEmail" placeholder="Email" autocomplete="email" class="glass-input">
        </div>
        <div class="a-field">
          <i class="fas fa-lock lead"></i>
          <input type="password" id="inputPassword" placeholder="Password" autocomplete="current-password" class="glass-input">
        </div>
        <button id="btnMasuk" class="auth-shine a-btn">Sign In <i class="fas fa-arrow-right"></i></button>

        <!-- GARIS PEMISAH -->
        <div class="a-sep">
          <span class="ln"></span>
          <span class="tx">Or continue with</span>
          <span class="ln"></span>
        </div>

        <!-- TOMBOL GOOGLE & GITHUB -->
        <div class="a-social">
          <button id="btnGoogle" type="button">
            <i class="fab fa-google" style="color:#ef4444"></i>
            <span>Google</span>
          </button>
          <button id="btnGithub" type="button">
            <i class="fab fa-github" style="color:#fff"></i>
            <span>GitHub</span>
          </button>
        </div>
      </div>
      <p class="auth-switch">Don't have an account? <button type="button" id="authGoRegister" class="auth-link">Sign Up</button></p>
    </div>

    <!-- FORM DAFTAR BARU -->
    <div id="formRegister" class="auth-fade hidden-el">
      <div class="space-y-3 hide-scroll">
        <div data-reg-field="email">
          <div class="a-field">
            <i class="fas fa-user lead"></i>
            <input type="email" id="regEmail" name="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="Masukkan Email" class="glass-input pr-10" aria-describedby="regEmailMsg">
            <i class="fas fa-check-circle reg-ok"></i>
          </div>
          <p class="reg-msg" id="regEmailMsg" role="alert"><i class="fas fa-exclamation-circle"></i><span></span></p>
        </div>
        <div data-reg-field="name">
          <div class="a-field">
            <i class="fas fa-id-card lead"></i>
            <input type="text" id="regName" name="name" autocomplete="name" placeholder="Masukkan Nama Lengkap" class="glass-input pr-10" aria-describedby="regNameMsg">
            <i class="fas fa-check-circle reg-ok"></i>
          </div>
          <p class="reg-msg" id="regNameMsg" role="alert"><i class="fas fa-exclamation-circle"></i><span></span></p>
        </div>
        <div data-reg-field="phone">
          <div class="a-field">
            <i class="fab fa-whatsapp lead"></i>
            <input type="tel" id="regPhone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="Masukkan Nomor WhatsApp (08xx)" class="glass-input pr-10" aria-describedby="regPhoneMsg">
            <i class="fas fa-check-circle reg-ok"></i>
          </div>
          <p class="reg-msg" id="regPhoneMsg" role="alert"><i class="fas fa-exclamation-circle"></i><span></span></p>
        </div>
        <div data-reg-field="pass">
          <div class="a-field">
            <i class="fas fa-lock lead"></i>
            <input type="password" id="regPass" name="new-password" autocomplete="new-password" placeholder="Min. 8 karakter" class="glass-input pr-11" aria-describedby="regPassRules regPassMsg">
            <button type="button" id="regPassEye" class="reg-eye" aria-label="Tampilkan password" aria-pressed="false"><i class="fas fa-eye"></i></button>
          </div>
          <div class="reg-rules" id="regPassRules" aria-live="polite">
            <div class="reg-rule" data-rule="len"><span class="dot"><i class="fas fa-check"></i></span>8+ karakter</div>
            <div class="reg-rule" data-rule="upper"><span class="dot"><i class="fas fa-check"></i></span>1 huruf besar</div>
            <div class="reg-rule" data-rule="num"><span class="dot"><i class="fas fa-check"></i></span>1 angka</div>
            <div class="reg-rule" data-rule="sym"><span class="dot"><i class="fas fa-check"></i></span>1 simbol</div>
          </div>
          <p class="reg-msg" id="regPassMsg" role="alert"><i class="fas fa-exclamation-circle"></i><span></span></p>
        </div>
      </div>
      <button id="btnDaftar" class="auth-shine a-btn">Create Account <i class="fas fa-arrow-right"></i></button>
      <p class="auth-switch">Already have an account? <button type="button" id="authGoLogin" class="auth-link">Sign In</button></p>
    </div>

  </div>
</div>

<!-- Firebase SDK (sama dengan index.html: v9.23.0 compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<!-- auth.js: login dulu, setelah itu memuat js/charts.js, js/pet.js, js/app.js -->
<script src="js/auth.js"></script>
</body>
</html>
